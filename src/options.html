<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>X Interceptor — Dashboard</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --panel: #f7f9f9;
        --fg: #0f1419;
        --muted: #536471;
        --line: #e6e8ea;
        --accent: #1d9bf0;
        --hit: #f4212e;
        --keep: #00ba7c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15202b;
          --panel: #1c2732;
          --fg: #f7f9f9;
          --muted: #8b98a5;
          --line: #2f3b47;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
      .spacer { flex: 1; }
      .stat { color: var(--muted); font-size: 13px; }
      .stat b { color: var(--fg); font-variant-numeric: tabular-nums; }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(320px, 30%) 1fr;
        min-height: 0;
      }
      @media (max-width: 820px) {
        main { grid-template-columns: 1fr; }
        #rules { border-right: none; border-bottom: 1px solid var(--line); }
      }

      #rules {
        border-right: 1px solid var(--line);
        padding: 18px 20px 24px;
        overflow-y: auto;
        background: var(--panel);
      }
      #right { display: flex; flex-direction: column; min-height: 0; }

      .field { margin-bottom: 16px; }
      .field > label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 5px;
      }
      .field .sub { font-weight: 400; text-transform: none; letter-spacing: 0; }

      textarea {
        width: 100%;
        min-height: 108px;
        resize: vertical;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: inherit;
        font: 13px/1.6 ui-monospace, Consolas, monospace;
        tab-size: 2;
      }
      textarea:focus, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

      select, input[type="search"] {
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: inherit;
        font: inherit;
      }
      select { width: 100%; }

      button {
        padding: 6px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }
      button:not(:disabled):hover { filter: brightness(0.94); }

      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }

      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      input[type="search"] { flex: 1; min-width: 220px; }

      .segmented { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
      .segmented button { border: none; border-radius: 0; padding: 6px 12px; font-size: 13px; }
      .segmented button[aria-pressed="true"] { background: var(--accent); color: #fff; }

      #summary {
        padding: 10px 20px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 9px;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .pill.hit { border-color: var(--hit); color: var(--hit); }
      .pill.keep { border-color: var(--keep); color: var(--keep); }
      .pill.dim { opacity: 0.55; }

      #list { flex: 1; overflow-y: auto; }
      .tweet {
        padding: 11px 20px 11px 17px;
        border-bottom: 1px solid var(--line);
        border-left: 3px solid transparent;
      }
      .tweet.match-hide { border-left-color: var(--hit); background: color-mix(in srgb, var(--hit) 6%, transparent); }
      .tweet.match-keep { border-left-color: var(--keep); background: color-mix(in srgb, var(--keep) 6%, transparent); }
      .who { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
      .name { font-weight: 600; }
      .handle { color: var(--muted); font-size: 13px; text-decoration: none; }
      .handle:hover { text-decoration: underline; }
      .scopes { display: flex; gap: 4px; }
      .scope {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 1px 6px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--fg) 10%, transparent);
        color: var(--muted);
      }
      .text { margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .meta { color: var(--muted); font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; }
      .empty { padding: 48px 20px; text-align: center; color: var(--muted); }

      .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
      code {
        font-family: ui-monospace, Consolas, monospace;
        background: color-mix(in srgb, var(--fg) 8%, transparent);
        border-radius: 3px;
        padding: 0 4px;
      }
      table.hits { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
      table.hits td { padding: 3px 0; border-bottom: 1px solid var(--line); }
      table.hits td.n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); width: 4em; }
      table.hits td.zero { color: var(--hit); }
      table.hits td.term { font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
      details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
      .sticky-actions {
        position: sticky;
        bottom: -24px;
        padding: 12px 0 0;
        background: linear-gradient(to bottom, transparent, var(--panel) 30%);
      }
      .dirty { color: var(--accent); font-size: 12px; }

      #hookbar {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 22px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.ok { background: var(--keep); }
      .dot.warn { background: var(--hit); }
    </style>
  </head>
  <body>
    <header>
      <h1>X Interceptor</h1>
      <label class="check"><input type="checkbox" id="capture" /> Capture</label>
      <label class="check"><input type="checkbox" id="hideBlocked" /> Filter before render</label>
      <span class="spacer"></span>
      <span class="stat">
        <b id="statTweets">0</b> tweets · <b id="statUsers">0</b> accounts ·
        <span
          title="Entries actually removed from live payloads since install. The preview below is a different number: it scores the rules against the whole captured sample, including tweets captured before filtering was on."
          ><b id="statBlocked">0</b> filtered live</span
        >
      </span>
      <button id="matched">Matched accounts ↗</button>
      <button id="clear">Clear store</button>
    </header>

    <div id="hookbar"><span class="dot"></span><span id="hookText">…</span></div>

    <main>
      <section id="rules">
        <div class="field">
          <label for="matchMode">Mode</label>
          <select id="matchMode">
            <option value="block">Hide tweets that match</option>
            <option value="keep">Show only tweets that match</option>
          </select>
        </div>

        <div class="field">
          <label for="blockNames">
            Display name contains
            <span class="sub">— one per line</span>
          </label>
          <textarea id="blockNames" spellcheck="false" placeholder="🚀&#10;💎&#10;# spam patterns&#10;DM for promo"></textarea>
        </div>

        <div class="field">
          <label for="blockUsers">
            Handles <span class="sub">— exact match</span>
          </label>
          <textarea id="blockUsers" spellcheck="false" placeholder="elonmusk&#10;@someacct"></textarea>
        </div>

        <div class="field">
          <label for="blockKeywords">
            Tweet text contains <span class="sub">— one per line</span>
          </label>
          <textarea id="blockKeywords" spellcheck="false" placeholder="airdrop&#10;free crypto"></textarea>
        </div>

        <details open>
          <summary>Per-term hits in captured data</summary>
          <table class="hits"><tbody id="termHits"></tbody></table>
        </details>

        <div class="hint">
          Blank lines and lines starting with <code>#</code> are ignored.
        </div>

        <div class="row" style="margin-top: 14px">
          <button id="exportRules">Export rules</button>
          <button id="importRules">Import rules</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden />
          <span id="rulesIo" class="hint" style="margin-top: 0"></span>
        </div>

        <div class="sticky-actions row">
          <button class="primary" id="save" disabled>Save rules</button>
          <button id="revert" disabled>Revert</button>
          <span id="dirty" class="dirty"></span>
        </div>
      </section>

      <section id="right">
        <div class="toolbar">
          <input
            type="search"
            id="search"
            placeholder="Search — try name:🚀, text:airdrop, @handle"
          />
          <div class="segmented" id="view">
            <button data-view="all" aria-pressed="true">All</button>
            <button data-view="matched" aria-pressed="false">Matched</button>
            <button data-view="rest" aria-pressed="false">Unmatched</button>
          </div>
          <button id="export">Export view</button>
        </div>

        <div id="summary"></div>
        <div id="list"></div>
      </section>
    </main>

    <script src="rules.js"></script>
    <script src="options.js"></script>
  </body>
</html>
