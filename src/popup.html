<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>X Interceptor</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #0f1419;
        --muted: #536471;
        --line: #e6e8ea;
        --accent: #1d9bf0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15202b;
          --fg: #f7f9f9;
          --muted: #8b98a5;
          --line: #2f3b47;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 460px;
        height: 540px;
        margin: 0;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
      }
      header { padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .top { display: flex; align-items: center; gap: 8px; }
      h1 { font-size: 14px; margin: 0; flex: 1; }
      .stats { color: var(--muted); font-size: 12px; margin-top: 6px; }
      .stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
      label { display: flex; align-items: center; gap: 5px; font-size: 12px; cursor: pointer; }
      input[type="search"] {
        flex: 1;
        min-width: 0;
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      button {
        padding: 5px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:hover { filter: brightness(0.95); }
      #list { overflow-y: auto; flex: 1; }
      .tweet { padding: 9px 14px; border-bottom: 1px solid var(--line); }
      .who { display: flex; gap: 5px; align-items: baseline; }
      .name { font-weight: 600; }
      .handle, .meta { color: var(--muted); font-size: 12px; }
      .handle { text-decoration: none; }
      .text { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .empty { padding: 28px 14px; color: var(--muted); text-align: center; }
      .hint { color: var(--muted); font-size: 11px; margin-top: 5px; }
      code {
        font-family: ui-monospace, Consolas, monospace;
        background: color-mix(in srgb, var(--fg) 8%, transparent);
        border-radius: 3px;
        padding: 0 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="top">
        <h1>X Interceptor</h1>
        <button class="primary" id="dashboard">Dashboard ↗</button>
      </div>

      <div class="stats">
        <b id="count">0</b> tweets · <b id="users">0</b> accounts ·
        <b id="blocked">0</b> filtered
      </div>

      <div class="row">
        <label><input type="checkbox" id="capture" /> Capture</label>
        <label><input type="checkbox" id="hideBlocked" /> Filter before render</label>
      </div>

      <div class="row">
        <input type="search" id="search" placeholder="Search — try name:🚀 or @handle" />
        <button id="export">Export</button>
      </div>
      <div class="hint">
        Scope with <code>name:</code>, <code>text:</code> or <code>@</code>. Rules
        and preview live in the dashboard.
      </div>
    </header>

    <div id="list"></div>

    <script src="rules.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
