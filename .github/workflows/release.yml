name: Release to Chrome Web Store

# Fires when you push a version tag (e.g. `git tag v0.2.4 && git push origin v0.2.4`),
# or manually from the Actions tab (where you can choose draft vs. publish).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after upload (uncheck to leave it as a draft in the dashboard)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if store secrets are missing
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          missing=""
          [ -z "$CLIENT_ID" ]     && missing="$missing CWS_CLIENT_ID"
          [ -z "$CLIENT_SECRET" ] && missing="$missing CWS_CLIENT_SECRET"
          [ -z "$REFRESH_TOKEN" ] && missing="$missing CWS_REFRESH_TOKEN"
          [ -z "$EXTENSION_ID" ]  && missing="$missing CWS_EXTENSION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — see PUBLISHING.md"
            exit 1
          fi

      - name: Verify the tag matches manifest.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "manifest=$manifest_version  tag=$tag_version"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Tag v$tag_version does not match manifest version $manifest_version. Bump manifest.json before tagging."
            exit 1
          fi

      - name: Build package
        run: |
          zip -r extension.zip manifest.json src icons
          echo "--- package contents ---"
          unzip -l extension.zip

      - name: Upload and submit to Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          # Tag pushes always publish; manual runs honour the checkbox.
          PUBLISH: ${{ github.event.inputs.publish != 'false' }}
        run: |
          set -euo pipefail

          json() { node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))$1"; }

          echo "Exchanging refresh token for an access token..."
          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | json ".access_token")

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "undefined" ]; then
            echo "::error::Could not obtain an access token. The refresh token may have expired (see the 'In production' note in PUBLISHING.md)."
            exit 1
          fi

          echo "Uploading extension.zip to item $EXTENSION_ID ..."
          UPLOAD=$(curl -s \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -X PUT -T extension.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID")
          echo "$UPLOAD"
          STATE=$(echo "$UPLOAD" | json ".uploadState")
          if [ "$STATE" != "SUCCESS" ]; then
            echo "::error::Upload did not succeed (uploadState=$STATE). See the response above."
            exit 1
          fi
          echo "Upload succeeded."

          if [ "$PUBLISH" = "true" ]; then
            echo "Submitting for review / publishing..."
            PUB=$(curl -s \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "x-goog-api-version: 2" \
              -H "Content-Length: 0" \
              -X POST \
              "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")
            echo "$PUB"
            STATUS=$(echo "$PUB" | json ".status.join(',')" 2>/dev/null || echo "")
            echo "Publish status: $STATUS"
            case "$STATUS" in
              *ERROR*|*NOT_AUTHORIZED*)
                echo "::error::Publish call reported a problem — see the response above."
                exit 1;;
            esac
            echo "Submitted. Google review still applies before it goes live."
          else
            echo "Uploaded as a draft. Publish it from the Web Store dashboard when ready."
          fi
