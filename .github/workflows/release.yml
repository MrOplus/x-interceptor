name: Release to Chrome Web Store

# Fires when you publish a GitHub Release (Releases -> Draft a new release ->
# Publish), or manually from the Actions tab (where you can choose draft vs.
# publish). The release's tag must equal the manifest version, with or without a
# leading "v" (e.g. tag `0.2.4` or `v0.2.4` for manifest 0.2.4).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after upload (uncheck to leave it as a draft in the dashboard)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Everything below uses only tools preinstalled on the runner: jq, openssl,
    # curl, zip. No Node, no third-party actions.
    steps:
      - uses: actions/checkout@v4

      # A failing test here stops the job before anything reaches the store.
      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Fail early if store secrets are missing
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          missing=""
          [ -z "$SERVICE_ACCOUNT_KEY" ] && missing="$missing CWS_SERVICE_ACCOUNT_KEY"
          [ -z "$EXTENSION_ID" ]        && missing="$missing CWS_EXTENSION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — see PUBLISHING.md"
            exit 1
          fi

      - name: Verify the tag matches manifest.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest_version=$(jq -r '.version' manifest.json)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "manifest=$manifest_version  tag=$tag_version"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Release tag $tag_version does not match manifest version $manifest_version. Bump manifest.json before releasing."
            exit 1
          fi

      - name: Build package
        run: |
          zip -r extension.zip manifest.json src icons
          echo "--- package contents ---"
          unzip -l extension.zip

      - name: Upload and submit to Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          # Tag pushes always publish; manual runs honour the checkbox.
          PUBLISH: ${{ github.event.inputs.publish != 'false' }}
        run: |
          set -euo pipefail

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          # --- mint a short-lived access token from the service-account key ---
          # Sign a JWT-bearer assertion (RS256) and exchange it. The private key
          # goes to a temp file for `openssl` and is wiped on exit.
          echo "Minting an access token from the service-account key..."
          PK=$(mktemp)
          trap 'rm -f "$PK"' EXIT
          jq -r '.private_key' <<< "$CWS_SERVICE_ACCOUNT_KEY" > "$PK"
          client_email=$(jq -r '.client_email' <<< "$CWS_SERVICE_ACCOUNT_KEY")
          token_uri=$(jq -r '.token_uri // "https://oauth2.googleapis.com/token"' <<< "$CWS_SERVICE_ACCOUNT_KEY")

          now=$(date +%s)
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          claims=$(printf '%s' "{\"iss\":\"$client_email\",\"scope\":\"https://www.googleapis.com/auth/chromewebstore\",\"aud\":\"$token_uri\",\"iat\":$now,\"exp\":$((now + 3600))}" | b64url)
          signing_input="${header}.${claims}"
          signature=$(printf '%s' "$signing_input" | openssl dgst -sha256 -sign "$PK" -binary | b64url)
          jwt="${signing_input}.${signature}"

          token_resp=$(curl -s -X POST "$token_uri" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" \
            --data-urlencode "assertion=$jwt")
          ACCESS_TOKEN=$(jq -r '.access_token // empty' <<< "$token_resp")
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Token exchange failed: $token_resp"
            echo "Confirm the service-account email is added under dashboard Account and the Chrome Web Store API is enabled in the same GCP project."
            exit 1
          fi

          # --- upload the new package ---
          echo "Uploading extension.zip to item $EXTENSION_ID ..."
          UPLOAD=$(curl -s \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -X PUT -T extension.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID")
          echo "$UPLOAD"
          STATE=$(jq -r '.uploadState // empty' <<< "$UPLOAD")
          if [ "$STATE" != "SUCCESS" ]; then
            echo "::error::Upload did not succeed (uploadState=$STATE). See the response above."
            exit 1
          fi
          echo "Upload succeeded."

          # --- publish (or leave as a draft) ---
          if [ "$PUBLISH" = "true" ]; then
            echo "Submitting for review / publishing..."
            PUB=$(curl -s \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "x-goog-api-version: 2" \
              -H "Content-Length: 0" \
              -X POST \
              "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")
            echo "$PUB"
            STATUS=$(jq -r '.status // [] | join(",")' <<< "$PUB")
            echo "Publish status: $STATUS"
            case "$STATUS" in
              *ERROR*|*NOT_AUTHORIZED*)
                echo "::error::Publish call reported a problem — see the response above."
                exit 1;;
            esac
            echo "Submitted. Google review still applies before it goes live."
          else
            echo "Uploaded as a draft. Publish it from the Web Store dashboard when ready."
          fi
